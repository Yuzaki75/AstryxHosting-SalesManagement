name: Bug report
description: Report a problem with the dashboard, Discord bot, or deployment
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please **remove bot tokens, webhook URLs, passwords, and customer data** before submitting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
      placeholder: Saving Discord settings shows "Error saving Discord settings".
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps to reproduce the issue.
      placeholder: |
        1. Sign in and open the Discord tab
        2. Change the notification channel ID
        3. Click Save & Start Bot
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Dashboard / sales
        - Customers
        - Discord bot
        - Backups
        - Import / export
        - Docker / deployment
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: "1.0.0 (978a733)"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste error output with all secrets and customer details removed.
      render: shell
